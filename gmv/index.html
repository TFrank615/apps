<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="2025 PROTO">

    <link rel="apple-touch-icon" href="gmvlogo.png">
    <title>2025 PROTO</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .search-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 58px;
            padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
            background: #0b0b0c;
            border-bottom: 1px solid #2b2b2e;
            z-index: 20;
        }

        .search-input {
            min-width: 0;
            flex: 1;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #fff;
            color: #111;
            font-size: 16px;
            outline: none;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .toolbar-button {
            height: 40px;
            padding: 0 13px;
            border: 1px solid #2563eb;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .toolbar-button.secondary {
            min-width: 42px;
            padding: 0 10px;
            border-color: #4b5563;
            background: #27272a;
        }

        .toolbar-button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .search-status {
            min-width: 72px;
            color: #d4d4d8;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
        }

        .viewer-wrap {
            position: relative;
            min-height: 0;
            flex: 1;
        }

        #mapDisplay {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }

        @media (max-width: 640px) {
            .search-toolbar {
                flex-wrap: wrap;
            }

            .search-input {
                flex-basis: calc(100% - 86px);
            }

            .search-status {
                order: 5;
                width: 100%;
                min-height: 16px;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="search-toolbar" role="search" aria-label="Search protocol">
        <input
            id="protocolSearch"
            class="search-input"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            placeholder="Search the protocol..."
            aria-label="Search the protocol"
        >
        <button id="searchButton" class="toolbar-button" type="button">Search</button>
        <button id="previousButton" class="toolbar-button secondary" type="button" aria-label="Previous result" title="Previous result">&#9650;</button>
        <button id="nextButton" class="toolbar-button secondary" type="button" aria-label="Next result" title="Next result">&#9660;</button>
        <span id="searchStatus" class="search-status" aria-live="polite">Loading...</span>
    </div>

    <div class="viewer-wrap">
        <iframe id="mapDisplay" title="2025 Protocol PDF"></iframe>
    </div>

    <script>
        'use strict';

        const PDF_NAME = '2025protocol.pdf';
        const iframe = document.getElementById('mapDisplay');
        const searchInput = document.getElementById('protocolSearch');
        const searchButton = document.getElementById('searchButton');
        const previousButton = document.getElementById('previousButton');
        const nextButton = document.getElementById('nextButton');
        const searchStatus = document.getElementById('searchStatus');

        let pdfApplication = null;
        let viewerReady = false;
        let lastQuery = '';
        let eventsBound = false;
        let searchTimer = null;

        function buildViewerUrl(pdfName) {
            const pdfUrl = new URL(pdfName, window.location.href).href;
            return `pdfjs/web/viewer.html?file=${encodeURIComponent(pdfUrl)}&appVersion=8`;
        }

        function setSearchEnabled(enabled) {
            searchButton.disabled = !enabled;
            previousButton.disabled = !enabled;
            nextButton.disabled = !enabled;
        }

        function setStatus(message) {
            searchStatus.textContent = message;
        }

        function waitForPdfApplication(timeoutMs = 30000) {
            return new Promise((resolve, reject) => {
                const started = Date.now();

                const check = () => {
                    if (viewerReady) {
                        resolve(null);
                        return;
                    }

                    try {
                        const app = iframe.contentWindow && iframe.contentWindow.PDFViewerApplication;
                        if (app && app.eventBus && app.pdfDocument) {
                            resolve(app);
                            return;
                        }
                    } catch (error) {
                        reject(new Error('The PDF viewer must be hosted on the same website as index.html.'));
                        return;
                    }

                    if (Date.now() - started >= timeoutMs) {
                        reject(new Error('The PDF viewer did not finish loading.'));
                        return;
                    }

                    window.setTimeout(check, 150);
                };

                check();
            });
        }

        function bindPdfSearchEvents(app) {
            if (eventsBound) {
                return;
            }

            app.eventBus.on('updatefindmatchescount', event => {
                const count = event && event.matchesCount;
                if (!count) {
                    return;
                }

                if (count.total > 0) {
                    setStatus(`${count.current || 1} of ${count.total}`);
                } else if (lastQuery) {
                    setStatus('No results');
                }
            });

            app.eventBus.on('updatefindcontrolstate', event => {
                // PDF.js find states: 0 = found, 1 = not found, 2 = wrapped, 3 = pending.
                if (!event) {
                    return;
                }

                if (event.state === 1) {
                    setStatus('No results');
                } else if (event.state === 3) {
                    setStatus('Searching...');
                } else if (event.matchesCount && event.matchesCount.total > 0) {
                    setStatus(`${event.matchesCount.current || 1} of ${event.matchesCount.total}`);
                }
            });

            eventsBound = true;
        }

        async function prepareViewer() {
            setSearchEnabled(false);
            setStatus('Loading...');

            try {
                pdfApplication = await waitForPdfApplication();
                if (pdfApplication) {
                    bindPdfSearchEvents(pdfApplication);
                }
                viewerReady = true;
                setSearchEnabled(true);
                setStatus('Ready');
            } catch (error) {
                console.error(error);
                setStatus('Viewer error');
            }
        }

        function dispatchFind({ findPrevious = false, newSearch = false } = {}) {
            const query = searchInput.value.trim();

            if (!query) {
                lastQuery = '';
                setStatus('Ready');

                if (viewerReady && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({
                        channel: 'gmv-pdf-search',
                        type: 'find',
                        query: '',
                        findType: '',
                        findPrevious: false
                    }, window.location.origin);
                } else if (pdfApplication && pdfApplication.eventBus) {
                    pdfApplication.eventBus.dispatch('find', {
                        source: window,
                        type: '',
                        query: '',
                        caseSensitive: false,
                        entireWord: false,
                        highlightAll: true,
                        findPrevious: false,
                        matchDiacritics: false
                    });
                }
                return;
            }

            if (!viewerReady && (!pdfApplication || !pdfApplication.eventBus || !pdfApplication.pdfDocument)) {
                setStatus('Still loading...');
                return;
            }

            const queryChanged = query !== lastQuery;
            lastQuery = query;
            setStatus('Searching...');

            const findType = newSearch || queryChanged ? '' : 'again';
            const findBar = pdfApplication && pdfApplication.findBar;

            if (viewerReady && iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    channel: 'gmv-pdf-search',
                    type: 'find',
                    query,
                    findType,
                    findPrevious
                }, window.location.origin);
            } else if (findBar && findBar.findField && typeof findBar.dispatchEvent === 'function') {
                findBar.findField.value = query;
                findBar.highlightAll.checked = true;
                findBar.caseSensitive.checked = false;
                findBar.entireWord.checked = false;
                findBar.matchDiacritics.checked = false;
                findBar.dispatchEvent(findType, findPrevious);
            } else {
                pdfApplication.eventBus.dispatch('find', {
                    source: window,
                    type: findType,
                    query,
                    caseSensitive: false,
                    entireWord: false,
                    highlightAll: true,
                    findPrevious,
                    matchDiacritics: false
                });
            }

        }

        function loadPdf(pdfName = PDF_NAME) {
            window.clearTimeout(searchTimer);
            pdfApplication = null;
            viewerReady = false;
            eventsBound = false;
            lastQuery = '';
            searchInput.value = '';
            setSearchEnabled(false);
            setStatus('Loading...');
            iframe.src = buildViewerUrl(pdfName);
        }

        searchButton.addEventListener('click', () => dispatchFind({ newSearch: true }));
        previousButton.addEventListener('click', () => dispatchFind({ findPrevious: true }));
        nextButton.addEventListener('click', () => dispatchFind({ findPrevious: false }));

        searchInput.addEventListener('input', () => {
            window.clearTimeout(searchTimer);
            searchTimer = window.setTimeout(() => {
                dispatchFind({ newSearch: true });
            }, 250);
        });

        searchInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                event.preventDefault();
                window.clearTimeout(searchTimer);
                dispatchFind({ findPrevious: event.shiftKey });
            }
        });

        window.addEventListener('message', event => {
            if (
                event.origin !== window.location.origin ||
                event.source !== iframe.contentWindow ||
                !event.data ||
                event.data.channel !== 'gmv-pdf-search'
            ) {
                return;
            }

            if (event.data.type === 'ready') {
                viewerReady = true;
                setSearchEnabled(true);
                setStatus('Ready');
            } else if (event.data.type === 'status') {
                setStatus(event.data.message);
            }
        });

        iframe.addEventListener('load', prepareViewer);
        loadPdf(PDF_NAME);

        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .then(registration => registration.update())
                    .catch(error => console.error('Service worker failed:', error));
            });
        }
    </script>
</body>
</html>
